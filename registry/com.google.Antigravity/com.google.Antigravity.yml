id: com.google.Antigravity
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: antigravity
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --unset-env=ELECTRON_RUN_AS_NODE
  - --filesystem=home
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 antigravity-wrapper /app/bin/antigravity
      - install -Dm644 com.google.Antigravity.desktop /app/share/applications/com.google.Antigravity.desktop
      - install -Dm644 com.google.Antigravity.metainfo.xml /app/share/metainfo/com.google.Antigravity.metainfo.xml
      - install -Dm644 com.google.Antigravity.png /app/share/icons/hicolor/512x512/apps/com.google.Antigravity.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: Antigravity.tar.gz
        only-arches:
          - x86_64
        url: https://storage.googleapis.com/antigravity-public/antigravity-hub/2.8.0-5810824271495168/linux-x64/Antigravity.tar.gz
        sha256: 1be76c94c579564dc828c51b7b2828ea003e7c9cb82115199a319fbfb5889740
        size: 170773779
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: antigravity-wrapper
      - type: file
        path: com.google.Antigravity.desktop
      - type: file
        path: com.google.Antigravity.metainfo.xml
      - type: file
        path: com.google.Antigravity.png
