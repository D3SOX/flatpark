id: site.harbor.Harbor.Beta
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: harbor-beta
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/tray-icon:create
modules:
  - name: ayatana-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v1/ayatana-stack-ayatana-v1-gnome-50-x86_64.tar.xz
        sha256: 37a91a0840b06da5319c36275fad2b1dca906152553f295944b81f202d1476fc

  - name: libass
    buildsystem: autotools
    config-opts:
      - --libdir=/app/lib
      - --disable-static
      - --enable-shared
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        commit: e46aedea0a0d17da4c4ef49d84b94a7994664ab5

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Ddefault_library=shared
      - -Dtests=false
      - -Ddemos=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: mpv
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dlibmpv=true
      - -Dcplayer=true
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dtests=false
      - -Dlua=disabled
      - -Djavascript=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        commit: e48ac7ce08462f5e33af6ef9deeac6fa87eef01e

  - name: media-tools
    buildsystem: simple
    build-commands:
      - install -Dm755 /usr/bin/ffmpeg /app/bin/ffmpeg
      - install -Dm755 /usr/bin/ffprobe /app/bin/ffprobe
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.06.09/yt-dlp
        sha256: e5d57466682cfa9d61e9cf7c8a4f09b00f4a62af37d3bbdc4bcffdf63615feac

  - name: harbor-beta
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 harbor-beta-wrapper /app/bin/harbor-beta
      - install -Dm644 site.harbor.Harbor.Beta.desktop /app/share/applications/site.harbor.Harbor.Beta.desktop
      - install -Dm644 site.harbor.Harbor.Beta.metainfo.xml /app/share/metainfo/site.harbor.Harbor.Beta.metainfo.xml
      - install -Dm644 site.harbor.Harbor.Beta.png /app/share/icons/hicolor/512x512/apps/site.harbor.Harbor.Beta.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: harbor-beta.deb
        only-arches:
          - x86_64
        url: https://github.com/harborstremio-linux/harbor-linux-builds/releases/download/beta-v0.9.115/Harbor_0.9.115_amd64.deb
        sha256: 43eb0cf188f804b4228244db447672578530f75b6e7cea6c2caef5f1624d5e28
        size: 93813408
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: harbor-beta-wrapper
      - type: file
        path: site.harbor.Harbor.Beta.desktop
      - type: file
        path: site.harbor.Harbor.Beta.metainfo.xml
      - type: file
        path: site.harbor.Harbor.Beta.png
