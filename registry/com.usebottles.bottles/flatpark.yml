id: com.usebottles.bottles
name: Bottles
summary: Run Windows software
website: https://usebottles.com
source_url: https://github.com/bottlesdevs/Bottles
build:
  manifest: com.usebottles.bottles.yml
  branch: stable
  mode: extra-data
catalog:
  category: Utility
  tags:
    - Wine
    - Windows
    - Gaming
    - Compatibility
    - GTK
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions:
    # A runtime environment for arbitrary Windows software: --device=all for
    # gamepad/wheel passthrough and direct GPU access, --allow=multiarch for
    # 32-bit, --allow=devel so wine can ptrace its own child processes.
    - device=all
    - allow=devel
    - allow=multiarch
