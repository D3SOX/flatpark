id: dk.nikse.subtitleedit
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: subtitleedit
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
modules:
  - name: mpv-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/mpv-v1/mpv-stack-mpv-v1-gnome-50-x86_64.tar.xz
        sha256: 900008f2263d53f72061e42f27775ab985510f496320aa366b2493662ec5a3be

  - name: ffmpeg-tools
    buildsystem: simple
    build-commands:
      - install -Dm755 /usr/bin/ffmpeg /app/bin/ffmpeg
      - install -Dm755 /usr/bin/ffprobe /app/bin/ffprobe

  - name: subtitleedit
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 subtitleedit-wrapper /app/bin/subtitleedit
      - install -Dm644 dk.nikse.subtitleedit.desktop /app/share/applications/dk.nikse.subtitleedit.desktop
      - install -Dm644 dk.nikse.subtitleedit.metainfo.xml /app/share/metainfo/dk.nikse.subtitleedit.metainfo.xml
      - install -Dm644 dk.nikse.subtitleedit.png /app/share/icons/hicolor/256x256/apps/dk.nikse.subtitleedit.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: subtitleedit.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/SubtitleEdit/subtitleedit/releases/download/v5.1.0/SubtitleEdit-Linux-x64.tar.gz
        sha256: 455938238969d3aa0a2a500ac061b66161bed1602a96846e01c883322cd5255f
        size: 59005452
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: subtitleedit-wrapper
      - type: file
        path: dk.nikse.subtitleedit.desktop
      - type: file
        path: dk.nikse.subtitleedit.metainfo.xml
      - type: file
        path: dk.nikse.subtitleedit.png
