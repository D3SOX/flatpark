# Scheduled upstream-update detection. Runs each app's update resolver, recomputes
# the extra-data pins, and opens a PR when anything moved. No signing key or R2
# creds here — it only reads public URLs and opens a PR; a human merges it, which
# triggers publish.yml.
#
# This is the pull-mode safety net. The fast path is release-dispatch.yml:
# upstream CI pings us on release and a single-app PR opens within minutes.
# This full sweep still catches everything push mode can't — apps whose
# upstream never adopted the action, releases whose Linux asset was uploaded
# after the ping, and resolver hiccups — and its supersede step below cleans
# up any per-app release PR still open.
name: update-check

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    # 24.04 镜像默认的 apt 源 azure.archive.ubuntu.com 挂了:apt-get update 全线
    # Ign,退回 archive.ubuntu.com 后拉索引时停住,publish #211 就这样零输出吊了
    # 68 分钟。26.04 不走那个源。它目前是 public preview,只当作绕开手段,
    # 那边的源恢复之后换回 ubuntu-latest。
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # update-pins validates any upstream release notes before writing them
      # into a metainfo. Without appstreamcli that guard silently no-ops, so
      # install it up front rather than leaving the check off in the one place
      # it actually runs unattended.
      - name: Install appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
      - name: Recompute pins from upstream
        run: |
          ids="$(./scripts/check-updates.sh | tr '\n' ' ')"
          echo "changed=$ids" >> "$GITHUB_ENV"
          echo "changed apps: ${ids:-<none>}"
      # A PR opened with the default GITHUB_TOKEN does not trigger pr-checks, so
      # nothing downstream of this job looks inside the artifact it just pinned.
      # That is how a repackaged upstream reaches users: com.tldraw.Offline v1.12.0
      # renamed the launcher inside its .deb, the pin refresh sailed through, and
      # every install failed with `apply_extra script failed, exit status 256`
      # (issue #130). Unpack each new payload here, the way an install does, and
      # hold back the pins that no longer unpack instead of shipping them.
      - name: Install flatpak
        if: env.changed != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak bubblewrap
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Verify the new payloads unpack
        if: env.changed != ''
        run: |
          held=""
          kept=""
          for id in $changed; do
            echo "::group::apply_extra $id"
            if INSTALL_RUNTIME=1 ./scripts/check-apply-extra.sh "$id"; then
              kept="$kept $id"
            else
              echo "::warning title=apply_extra failed for $id::holding back this pin; the new upstream artifact does not unpack"
              # Drop this app's recomputed pin, keeping it on the last version
              # known to install. check-updates.sh only touches the working tree.
              git checkout -- "registry/$id/"
              held="$held $id"
            fi
            echo "::endgroup::"
          done
          echo "changed=${kept# }" >> "$GITHUB_ENV"
          echo "held=${held# }" >> "$GITHUB_ENV"
          echo "held back: ${held:-<none>}"
      - name: Open / update PR if pins changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- registry/; then
            echo "no pin changes"; exit 0
          fi
          date="$(date -u +%Y-%m-%d)"
          branch="auto/update-pins-$date"
          git config user.name "flatpark-bot"
          git config user.email "bot@flatpark.org"
          git checkout -B "$branch"
          git add registry/
          git commit -m "chore(update): refresh extra-data pins (${changed:-apps})"
          git push -f origin "$branch"

          # One app id per line, as a markdown list
          apps_md="$(for id in ${changed:-}; do printf -- '- `%s`\n' "$id"; done)"
          [ -n "$apps_md" ] || apps_md='- (see diff)'
          title="Update extra-data pins ($date)"
          body="$(printf 'Automated extra-data pin refresh — %s\n\n**Updated apps:**\n\n%s\n\nEach payload was unpacked with the app'"'"'s `apply_extra.sh` before being pinned here.\n\nMerging triggers a rebuild + publish of the changed app(s).' "$date" "$apps_md")"
          if [ -n "${held:-}" ]; then
            held_md="$(for id in $held; do printf -- '- `%s`\n' "$id"; done)"
            body="$(printf '%s\n\n**Held back — the new upstream artifact does not unpack:**\n\n%s\n\nThese keep their current pin. Their `apply_extra.sh` needs a look before the update can ship.' "$body" "$held_md")"
          fi

          # Create today's PR, or refresh it if this branch already opened one earlier today
          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          else
            gh pr edit "$branch" --title "$title" --body "$body"
          fi

          # Supersede older open auto-update PRs and per-app release PRs
          # (release-dispatch.yml, auto/release-*): today's batch is recomputed
          # against main, so it's a superset of any unmerged earlier one — keep
          # a single open PR.
          new="$(gh pr list --head "$branch" --state open --json number -q '.[0].number')"
          for n in $(gh pr list --state open --json number,headRefName \
                       -q ".[] | select((.headRefName | startswith(\"auto/update-pins-\")) or (.headRefName | startswith(\"auto/release-\"))) | select(.headRefName != \"$branch\") | .number"); do
            echo "superseding older auto-update PR #$n"
            gh pr close "$n" --comment "Superseded by #$new ($date pin refresh)." --delete-branch || true
          done
      # Last, so a held-back app still gets its PR opened for the apps that passed.
      # A red daily run is the point: an upstream that repackaged needs a human.
      - name: Fail if any pin was held back
        if: env.held != ''
        run: |
          echo "held back — apply_extra failed against the new payload:$held" >&2
          exit 1
